<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="khataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#khataGrad)" />
  <!-- Book / Khata cover outline -->
  <rect x="80" y="80" width="352" height="352" rx="32" fill="#ffffff" fill-opacity="0.12" />
  <rect x="96" y="96" width="320" height="320" rx="24" fill="#ffffff" />
  <!-- Left ledger spine binding -->
  <path d="M96 120 C96 106.745 106.745 96 120 96 L150 96 L150 416 L120 416 C106.745 416 96 405.255 96 392 Z" fill="#047857" />
  <!-- Golden Bookmark ribbon -->
  <polygon points="120,96 140,96 140,200 130,185 120,200" fill="url(#goldGrad)" />
  <!-- Ledger lines inside white sheet -->
  <line x1="180" y1="160" x2="380" y2="160" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  <line x1="180" y1="210" x2="380" y2="210" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  <line x1="180" y1="260" x2="380" y2="260" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round" />
  <!-- Taka / Currency Symbol / Checkmark Emblem -->
  <circle cx="280" cy="335" r="45" fill="url(#khataGrad)" />
  <text x="280" y="352" font-family="'Hind Siliguri', sans-serif, Arial" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle">৳</text>
</svg>
